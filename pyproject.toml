[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "octopus-security"
version = "1.1.0"
description = "Evidence-driven, policy-gated security assessment orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "OCTOPUS contributors"}]
dependencies = [
    "cryptography>=50.0.0",
    "paramiko>=3.0",
    "python-dotenv>=1.2.2",
    "PyYAML>=6.0",
    "requests>=2.33.0",
    "rich>=13.7.0",
    "urllib3>=2.7.0",
]

[project.optional-dependencies]
c2 = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]
reporting = [
    "reportlab>=4.1.0",
]
osint-browser = [
    "beautifulsoup4>=4.12.0",
    "ddgs>=9.14.4",
    "httpx[socks]>=0.27.0",
    "lxml>=5.1.0",
    "patchright>=1.49.0",
    "primp>=0.6.0",
    "scrapling>=0.2.0",
    "shodan>=1.31.0",
]
mysql = [
    "mysql-connector-python>=9.0.0",
]

[project.scripts]
octopus = "core.application:main"
octopus-c2 = "octopus_c2:main"
octobench = "core.benchmarks.__main__:main"
octobench-competitors = "core.benchmarks.competitors.__main__:main"

[tool.setuptools]
include-package-data = true
py-modules = [
    "config",
    "db",
    "evasion",
    "export",
    "hash_cracker",
    "memory",
    "msf",
    "octopus",
    "octopus_c2",
    "search",
    "shodan_module",
    "tools",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmarks*", "core*", "modules*", "plugins*", "scripts*"]
namespaces = true

[tool.setuptools.package-data]
"benchmarks" = [
    "results/*.json",
    "scenarios/*.json",
]
"benchmarks.competitors" = [
    "catalog.json",
    "lab/Dockerfile",
    "lab/compose.yaml",
    "labs/*/Dockerfile",
    "labs/*/Dockerfile.dockerignore",
    "labs/*/README.md",
    "labs/*/compose.yaml",
    "campaigns/*/README.md",
    "campaigns/*/readiness-profile.json",
    "campaigns/*/scenarios/*.json",
    "scenarios/*.example",
    "systems/*.example",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "unit: hermetic in-process test with no service, subprocess, or platform dependency",
    "contract: hermetic compatibility or serialization/protocol boundary test",
    "replay: deterministic recorded-output or persisted-snapshot replay test",
    "integration: test crossing a process or component boundary",
    "slow: intentionally expensive test excluded from the fast suite",
    "external: requires a separately managed external service or executable",
    "external_tools: requires a separately installed scanner, browser, or service integration",
    "security: security-boundary, scope, policy, or redaction regression test",
    "benchmark: versioned scenario-harness or benchmark aggregation test",
    "mysql: requires a live MariaDB/MySQL service and the optional connector profile",
    "platform: depends on a specific operating system or platform facility",
]
filterwarnings = [
    "default",
]

[tool.ruff]
line-length = 120
# Keep the established syntax-modernization ratchet independent from the
# supported runtime floor; raising this enables hundreds of unrelated UP/B fixes.
target-version = "py39"
extend-exclude = [
    "venv",
    "vendor",
    "data",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "PIE",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"__init__.py" = ["F401"]
"core/killchain/exploits/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# The transitive import backlog is tracked in docs/quality/static-analysis-baseline.md.
follow_imports = "skip"
check_untyped_defs = true
explicit_package_bases = true
files = [
    "benchmarks/competitors/labs/discovery-lab-v3/app.py",
    "benchmarks/competitors/labs/discovery-lab-v3/generate.py",
    "benchmarks/competitors/labs/discovery-lab-v3/reveal.py",
    "benchmarks/competitors/run_adapter.py",
    "benchmarks/competitors/run_campaign.py",
    "benchmarks/competitors/run_diagnostic_adapter.py",
    "benchmarks/competitors/run_lab.py",
    "core/application.py",
    "core/version.py",
    "core/actions",
    "core/ai",
    "core/benchmarks",
    "core/c2/__init__.py",
    "core/c2/builder.py",
    "core/c2/channels/__init__.py",
    "core/c2/crypto_engine.py",
    "core/c2/db_backend.py",
    "core/c2/enrollment.py",
    "core/c2/evasion.py",
    "core/c2/event_store.py",
    "core/c2/implants",
    "core/c2/key_store.py",
    "core/c2/operators.py",
    "core/c2/protocol.py",
    "core/cli",
    "core/colors.py",
    "core/credential_ranking.py",
    "core/credentials.py",
    "core/execution",
    "core/exploits/__init__.py",
    "core/exploits/exploit_mapper.py",
    "core/killchain/__init__.py",
    "core/killchain/ad/__init__.py",
    "core/killchain/ad/enumeration.py",
    "core/killchain/exploits/__init__.py",
    "core/killchain/exploits/baron_samedit.py",
    "core/killchain/exploits/base.py",
    "core/killchain/exploits/dirtycow.py",
    "core/killchain/exploits/dirtypipe.py",
    "core/knowledge",
    "core/observability/__init__.py",
    "core/opsec/artifact_mgr.py",
    "core/osint",
    "core/plugins",
    "core/runtime_config.py",
    "core/secrets.py",
    "core/supervisor.py",
    "core/tools/__init__.py",
    "core/tools/base.py",
    "core/tools/public.py",
    "core/tools/registry.py",
    "core/tools/targeting.py",
    "core/transport/profiles.py",
    "db.py",
    "modules",
    "octopus.py",
    "octopus_c2.py",
    "plugins",
    "scripts/__init__.py",
    "scripts/lock_requirements.py",
    "scripts/quality/__init__.py",
    "scripts/quality/coverage_gate.py",
    "scripts/quality/format_gate.py",
    "scripts/quality/go_coverage_gate.py",
    "scripts/quality/import_smoke.py",
    "scripts/quality/sbom.py",
    "scripts/quality/verify_vendor.py",
    "scripts/quality/wheel_smoke.py",
    "setup.py",
    "shodan_module.py",
    "tools.py",
]
exclude = [
    "venv/",
    "vendor/",
    "data/",
]
