name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  nightly-smoke:
    name: Nightly External Tools Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl nmap

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/locks/linux-x86_64/cp310/test.txt

      - name: Run external tools smoke tests
        env:
          OCTOPUS_REQUIRE_EXTERNAL_TOOLS: "1"
        run: |
          pytest tests/test_external_tools_smoke.py
