name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Quality Gates
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: octopus
          MYSQL_USER: octopus
          MYSQL_PASSWORD: octopus_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/locks/linux-x86_64/cp310/test.txt \
            -r requirements/locks/linux-x86_64/cp310/mysql.txt

      - name: Mypy (single repository gate)
        run: |
          python scripts/quality/mypy_gate.py check

      - name: Format & lint check
        run: |
          python scripts/quality/format_gate.py

      - name: Run unit & integration tests with coverage
        env:
          OCTOPUS_DB_HOST: 127.0.0.1
          OCTOPUS_DB_NAME: octopus
          OCTOPUS_DB_USER: octopus
          OCTOPUS_DB_PASS: octopus_password
        run: |
          pytest --cov=core --cov=octopus --cov=octopus_c2 --cov=search \
            --cov-config=quality/coverage-ci.ini \
            --cov-report=term-missing

      - name: Validate coverage thresholds
        run: |
          python scripts/quality/coverage_gate.py \
            --fail-under 94.00 \
            --diff-fail-under 90 \
            --package-fail-under core/actions=95 \
            --package-fail-under core/execution=92 \
            --package-fail-under core/benchmarks=100
          octopus.py octopus_c2.py search.py

      - name: Report risk-heavy killchain coverage
        run: |
          coverage report --include="core/killchain/ad/*.py,core/killchain/exploits/*.py" --fail-under=0

      - name: Go format check
        run: |
          mapfile -d '' go_files < <(git ls-files -z -- ':(top,glob)**/*.go')
          if [ ${#go_files[@]} -gt 0 ]; then
            gofmt -l "${go_files[@]}"
          fi

      - name: Go test & coverage
        working-directory: ${{ github.workspace }}
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
          CGO_ENABLED: "0"
          GOWORK: "off"
        run: |
          go list -mod=readonly -deps ./... > /dev/null
          go vet -mod=readonly ./...
          go build -mod=readonly -trimpath -buildvcs=false -ldflags=-buildid= ./...
          go test
          -mod=readonly \
          -covermode=atomic \
          -coverpkg=./... \
          -coverprofile="${RUNNER_TEMP}/c2-go.coverage.out" \
          ./...
          git diff --exit-code -- go.mod go.sum

      - name: Validate complete Go source coverage evidence
        run: |
          python scripts/quality/go_coverage_gate.py \
            --root core/c2 \
            --fail-under 0 \
            --profile "${RUNNER_TEMP}/c2-go.coverage.out"

      - name: Upload Go coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-go
          path: ${{ runner.temp }}/c2-go.coverage.out
          if-no-files-found: error

      - name: Generate deterministic full-repository CycloneDX SBOM
        run: |
          python scripts/quality/sbom.py requirements/locks/linux-x86_64/cp310/full.txt \
            --go-mod core/c2/go.mod \
            --vendor-manifest quality/vendor-manifest.json \
            --include-tool-dependencies \
            --output sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error
