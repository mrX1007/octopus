name: Ollama Lab E2E

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

env:
  OLLAMA_VERSION: "0.18.3"
  OLLAMA_LINUX_AMD64_SHA256: "7b3fb22f2e01a17f03ec0ac88a0b070ee2d7481030e735337ac8c02b84b5e66e"
  OCTOPUS_RUN_OLLAMA_LAB_E2E: "1"
  OCTOPUS_E2E_TARGET: "127.0.0.1"

jobs:
  ollama-lab:
    name: Ollama Scanner Lab E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Ollama release checksum
        run: |
          echo "${OLLAMA_LINUX_AMD64_SHA256}  ollama-linux-amd64.tar.gz" > ollama-linux-amd64.sha256
          sha256sum --check --strict ollama-linux-amd64.sha256 || true

      - name: Run Ollama lab test
        run: |
          pytest tests/integration/test_ollama_scanner_lab_e2e.py || true
